name: Backend build and test

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/osm/**"
      - "SPEC.md"
      - "docs/files/런닝구_API_명세서.md"
      - "scripts/check_spec_drift.py"
      - ".github/workflows/backend.yml"
      - ".github/actions/backend-verify/**"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "scripts/osm/**"
      - "SPEC.md"
      - "docs/files/런닝구_API_명세서.md"
      - "scripts/check_spec_drift.py"
      - ".github/workflows/backend.yml"
      - ".github/actions/backend-verify/**"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec-drift:
    name: Spec sync check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SPEC references in changed code
        run: |
          python3 scripts/check_spec_drift.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit, integration, and bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: runninggu_import_smoke
          POSTGRES_USER: runninggu
          POSTGRES_PASSWORD: importer-smoke-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runninggu -d runninggu_import_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      # PR은 synthetic merge, push는 해당 commit 자체를 검사한다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 백엔드 공통 검사와 빌드
        uses: ./.github/actions/backend-verify

      - name: Record artifact identity and checksums
        if: github.event_name == 'push'
        env:
          RELEASE_GIT_COMMIT: ${{ github.sha }}
        run: |
          printf 'git_commit=%s\nworkflow_run_id=%s\n' \
            "$RELEASE_GIT_COMMIT" "$GITHUB_RUN_ID" \
            > build/ec2-artifact/release-manifest.txt
          cd build/ec2-artifact
          sha256sum \
            runninggu-server.jar \
            runninggu-contest-import.jar \
            data/contest_snapshot.json \
            release-manifest.txt \
            > SHA256SUMS

      - name: Upload EC2 deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: runninggu-backend-${{ github.sha }}
          path: backend/build/ec2-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7
