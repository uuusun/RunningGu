name: Android build and test

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [develop, main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# 같은 브랜치에 연달아 push 하면 앞의 실행은 취소한다.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties 의 toolchainVersion 과 맞춘다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # domain 은 Android 의존이 없는 순수 Kotlin 이라 기기 없이 검증된다. (SPEC §5)
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      # 실패했을 때 어느 테스트가 왜 깨졌는지 보려면 리포트가 필요하다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
