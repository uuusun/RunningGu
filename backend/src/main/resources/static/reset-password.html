<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>런닝구 비밀번호 재설정</title>
  <style>
    :root { font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; color: #17251b; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(150deg, #effff3 0%, #f8fbf8 52%, #f2f7ff 100%);
    }
    main {
      width: min(100%, 440px); padding: 36px 30px; border: 1px solid #dce9df;
      border-radius: 24px; background: rgba(255, 255, 255, .94);
      box-shadow: 0 20px 55px rgba(28, 78, 43, .12);
    }
    .brand { margin: 0 0 28px; color: #16803a; font-size: 18px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.04em; }
    .description { margin: 0 0 28px; color: #657068; line-height: 1.55; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; min-height: 50px; border: 1px solid #cbd7ce; border-radius: 12px;
      padding: 0 14px; font: inherit; outline: none;
    }
    input:focus { border-color: #1d9b48; box-shadow: 0 0 0 3px rgba(29, 155, 72, .12); }
    input[aria-invalid="true"] { border-color: #b42318; }
    input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(180, 35, 24, .12); }
    .hint { margin: 8px 0 0; color: #78827b; font-size: 12px; }
    button {
      width: 100%; min-height: 52px; margin-top: 26px; border: 0; border-radius: 13px;
      background: #16883f; color: white; font: inherit; font-weight: 800; cursor: pointer;
    }
    button:disabled { background: #9aafa0; cursor: wait; }
    #message { min-height: 24px; margin: 16px 0 0; font-size: 14px; line-height: 1.5; }
    #message.error { color: #b42318; }
    #message.success { color: #107735; }
  </style>
</head>
<body>
<main>
  <p class="brand">런닝구</p>
  <h1>새 비밀번호 설정</h1>
  <p class="description">8자 이상, 영문과 숫자를 함께 써 주세요.</p>
  <form id="reset-form" novalidate>
    <label for="new-password">새 비밀번호</label>
    <input id="new-password" name="newPassword" type="password" autocomplete="new-password"
           aria-describedby="password-hint" aria-errormessage="message" required>
    <p class="hint" id="password-hint">UTF-8 기준 최대 72바이트</p>
    <label for="confirm-password">새 비밀번호 확인</label>
    <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
           aria-errormessage="message" required>
    <button id="submit-button" type="submit">비밀번호 변경</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  const form = document.querySelector('#reset-form');
  const button = document.querySelector('#submit-button');
  const message = document.querySelector('#message');
  const newPasswordInput = document.querySelector('#new-password');
  const confirmPasswordInput = document.querySelector('#confirm-password');
  const token = new URLSearchParams(window.location.search).get('token');
  const MIN_PASSWORD_CODE_POINTS = 8;
  const MAX_PASSWORD_UTF8_BYTES = 72;
  const ASCII_LETTER = /[A-Za-z]/;
  const DIGIT = /[0-9]/;
  const utf8Encoder = new TextEncoder();
  const PASSWORD_FORMAT_MESSAGE = '8자 이상, 영문과 숫자를 함께 써 주세요.';
  const PASSWORD_BYTES_MESSAGE = '비밀번호는 UTF-8 기준 72바이트 이하여야 합니다.';

  function show(text, kind) {
    message.textContent = text;
    message.className = kind;
  }

  // 서버 PasswordPolicy와 같은 입력 규칙이다. (SPEC NFR-9)
  function passwordValidationMessage(password) {
    if ([...password].length < MIN_PASSWORD_CODE_POINTS
        || !ASCII_LETTER.test(password)
        || !DIGIT.test(password)) {
      return PASSWORD_FORMAT_MESSAGE;
    }
    if (utf8Encoder.encode(password).length > MAX_PASSWORD_UTF8_BYTES) {
      return PASSWORD_BYTES_MESSAGE;
    }
    return null;
  }

  function showInputError(input, text) {
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    show(text, 'error');
  }

  newPasswordInput.addEventListener('input', () => {
    newPasswordInput.removeAttribute('aria-invalid');
  });
  confirmPasswordInput.addEventListener('input', () => {
    confirmPasswordInput.removeAttribute('aria-invalid');
  });

  if (!token) {
    show('재설정 링크가 올바르지 않습니다. 메일에서 링크를 다시 확인해 주세요.', 'error');
    button.disabled = true;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = newPasswordInput.value;
    const confirmation = confirmPasswordInput.value;
    newPasswordInput.removeAttribute('aria-invalid');
    confirmPasswordInput.removeAttribute('aria-invalid');

    const validationMessage = passwordValidationMessage(password);
    if (validationMessage) {
      showInputError(newPasswordInput, validationMessage);
      return;
    }
    if (password !== confirmation) {
      showInputError(confirmPasswordInput, '새 비밀번호가 서로 일치하지 않습니다.');
      return;
    }

    button.disabled = true;
    show('비밀번호를 변경하고 있어요.', '');
    try {
      const response = await fetch('/api/auth/password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password })
      });
      if (response.status === 204) {
        form.reset();
        show('비밀번호를 변경했습니다. 런닝구 앱에서 다시 로그인해 주세요.', 'success');
        return;
      }
      const problem = await response.json().catch(() => ({}));
      if (problem.code === 'INVALID_RESET_TOKEN') {
        show('링크가 만료됐거나 이미 사용됐습니다. 앱에서 재설정 메일을 다시 요청해 주세요.', 'error');
      } else if (problem.code === 'INVALID_PASSWORD') {
        showInputError(newPasswordInput, PASSWORD_FORMAT_MESSAGE);
      } else {
        show('비밀번호를 변경하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'error');
      }
    } catch (error) {
      show('서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.', 'error');
    } finally {
      if (!message.classList.contains('success')) button.disabled = false;
    }
  });
</script>
</body>
</html>
