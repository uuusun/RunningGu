spring:
  application:
    name: runninggu-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

runninggu:
  external:
    kakao-local:
      base-url: https://dapi.kakao.com
      rest-key: ${KAKAO_REST_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
