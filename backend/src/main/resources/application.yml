spring:
  application:
    name: runninggu-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: caffeine
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

runninggu:
  upstream-load-guard:
    # staging 앱 API 부하 시험에서만 명시적으로 켠다. 기본 실행과 production은 비활성이다.
    enabled: ${UPSTREAM_LOAD_GUARD_ENABLED:false}
    deployment-environment: ${RUNNINGGU_DEPLOYMENT_ENVIRONMENT:local}
    run-id: ${UPSTREAM_LOAD_GUARD_RUN_ID:}
    kakao-total-limit: ${UPSTREAM_LOAD_GUARD_KAKAO_TOTAL_LIMIT:0}
    endpoints:
      kakao-category: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-keyword: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-access-token-info: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-user-me: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kto-search-festival: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-kor-location: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-wellness-location: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-durunubi-course: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
  course:
    catalog:
      bundle-resource: classpath:data/courses.json
      minimum-course-count: 261
    sync:
      enabled: ${COURSE_SYNC_ENABLED:true}
      interval: 24h
  auth:
    cleanup:
      interval: 1h
    jwt:
      secret: ${JWT_SECRET}
      issuer: runninggu
      audience: runninggu-api
      access-ttl: 30m
      refresh-ttl: 14d
    agreements:
      tos-version: "1.0"
      privacy-version: "1.0"
      marketing-version: "1.0"
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${SMTP_FROM_ADDRESS:}
    from-name: ${SMTP_FROM_NAME:런닝구}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/reset-password}
  external:
    kakao-user-info:
      base-url: https://kapi.kakao.com
      app-id: ${KAKAO_APP_ID}
      connect-timeout: 1s
      read-timeout: 2500ms
    kakao-local:
      base-url: https://dapi.kakao.com
      rest-key: ${KAKAO_REST_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-festival:
      base-url: https://apis.data.go.kr/B551011/KorService2
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-poi:
      base-url: https://apis.data.go.kr/B551011/KorService2
      wellness-base-url: https://apis.data.go.kr/B551011/WellnessTursmService
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-course:
      base-url: https://apis.data.go.kr/B551011/Durunubi
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    graphhopper:
      enabled: ${GRAPHHOPPER_ENABLED:false}
      base-url: ${GRAPHHOPPER_BASE_URL:http://localhost:8989}
      connect-timeout: 500ms
      read-timeout: 5s
