spring:
  application:
    name: runninggu-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  http:
    # framework 진단에 요청 헤더·파라미터 원문을 포함하지 않는다. (SPEC §9.4)
    log-request-details: false
  mvc:
    # 처리된 MVC 예외의 원문을 framework가 다시 기록하지 않는다. (SPEC §9.4)
    log-resolved-exception: false
    problemdetails:
      enabled: true
  cache:
    type: caffeine
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    # 접속 기록은 요청 원문을 제외하는 nginx runninggu_minimal 한 곳에서만 만든다. (SPEC §9.4)
    accesslog:
      enabled: false
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  # framework가 Throwable을 기록해도 message/cause/stack 원문을 출력하지 않는다. (SPEC §9.4)
  exception-conversion-word: "%nopex"
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    # PostgreSQL 제약 오류 Detail에는 provider_subject(이메일)가 포함될 수 있다.
    # GlobalExceptionHandler의 안전한 code/traceId 로그를 진단 기준으로 사용한다. (SPEC §9.4)
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

runninggu:
  upstream-load-guard:
    # staging 앱 API 부하 시험에서만 명시적으로 켠다. 기본 실행과 production은 비활성이다.
    enabled: ${UPSTREAM_LOAD_GUARD_ENABLED:false}
    deployment-environment: ${RUNNINGGU_DEPLOYMENT_ENVIRONMENT:local}
    run-id: ${UPSTREAM_LOAD_GUARD_RUN_ID:}
    kakao-total-limit: ${UPSTREAM_LOAD_GUARD_KAKAO_TOTAL_LIMIT:0}
    endpoints:
      kakao-category: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-keyword: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-access-token-info: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kakao-user-me: ${UPSTREAM_LOAD_GUARD_KAKAO_ENDPOINT_LIMIT:0}
      kto-search-festival: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-kor-location: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-wellness-location: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
      kto-durunubi-course: ${UPSTREAM_LOAD_GUARD_KTO_ENDPOINT_LIMIT:0}
  course:
    catalog:
      bundle-resource: classpath:data/courses.json
      minimum-course-count: 261
    sync:
      enabled: ${COURSE_SYNC_ENABLED:true}
      interval: 24h
  auth:
    cleanup:
      interval: 1h
    jwt:
      secret: ${JWT_SECRET}
      issuer: runninggu
      audience: runninggu-api
      access-ttl: 30m
      refresh-ttl: 14d
    agreements:
      tos-version: "1.0"
      privacy-version: "1.0"
      marketing-version: "1.0"
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${SMTP_FROM_ADDRESS:}
    from-name: ${SMTP_FROM_NAME:런닝구}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/reset-password}
  external:
    kakao-user-info:
      base-url: https://kapi.kakao.com
      app-id: ${KAKAO_APP_ID}
      connect-timeout: 1s
      read-timeout: 2500ms
    kakao-local:
      base-url: https://dapi.kakao.com
      rest-key: ${KAKAO_REST_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-festival:
      base-url: https://apis.data.go.kr/B551011/KorService2
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-poi:
      base-url: https://apis.data.go.kr/B551011/KorService2
      wellness-base-url: https://apis.data.go.kr/B551011/WellnessTursmService
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-course:
      base-url: https://apis.data.go.kr/B551011/Durunubi
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    graphhopper:
      enabled: ${GRAPHHOPPER_ENABLED:false}
      base-url: ${GRAPHHOPPER_BASE_URL:http://localhost:8989}
      connect-timeout: 500ms
      read-timeout: 5s
