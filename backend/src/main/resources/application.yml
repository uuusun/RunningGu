spring:
  application:
    name: runninggu-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: caffeine
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

runninggu:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      issuer: runninggu
      audience: runninggu-api
      access-ttl: 30m
      refresh-ttl: 14d
    agreements:
      tos-version: "1.0"
      privacy-version: "1.0"
      marketing-version: "1.0"
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${SMTP_FROM_ADDRESS:}
    from-name: ${SMTP_FROM_NAME:런닝구}
  external:
    kakao-user-info:
      base-url: https://kapi.kakao.com
      app-id: ${KAKAO_APP_ID}
      connect-timeout: 1s
      read-timeout: 2500ms
    kakao-local:
      base-url: https://dapi.kakao.com
      rest-key: ${KAKAO_REST_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-festival:
      base-url: https://apis.data.go.kr/B551011/KorService2
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
    kto-poi:
      base-url: https://apis.data.go.kr/B551011/KorService2
      wellness-base-url: https://apis.data.go.kr/B551011/WellnessTursmService
      service-key: ${KTO_SERVICE_KEY:}
      connect-timeout: 1s
      read-timeout: 2500ms
