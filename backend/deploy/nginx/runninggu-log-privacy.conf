# /etc/nginx/conf.d에 설치한다. sites-enabled보다 먼저 http 문맥에서 읽힌다.
# 요청자가 정하는 method 원문은 allowlist로 바꾸고 URI·query·Host·User-Agent는 기록하지 않는다.
# IP는 접속 기록과 남용 대응을 위해 14일 보관한다. (SPEC §9.4, 결정-61)
map $request_method $runninggu_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

log_format runninggu_minimal '$remote_addr - [$time_local] '
                              'method=$runninggu_log_method status=$status '
                              'bytes=$body_bytes_sent request_time=$request_time '
                              'upstream_status=$upstream_status '
                              'upstream_response_time=$upstream_response_time';
