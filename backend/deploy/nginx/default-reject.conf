# TLS 인증서 발급 뒤 설치한다. IP 주소나 알 수 없는 Host로 들어온 요청은 앱에 전달하지 않는다.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/staging-api.runninggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.runninggu.store/privkey.pem;
    include /etc/nginx/snippets/runninggu-ssl-params.conf;

    return 444;
}
