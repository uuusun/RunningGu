log_format runninggu_noqs '$remote_addr - [$time_local] '
                          '"$request_method $uri $server_protocol" $status '
                          '$body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name api.runninggu.store;
    server_tokens off;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_noqs;
    error_log /var/log/nginx/runninggu-production.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.runninggu.store;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.runninggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.runninggu.store/privkey.pem;
    include /etc/nginx/snippets/runninggu-ssl-params.conf;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_noqs;
    error_log /var/log/nginx/runninggu-production.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
