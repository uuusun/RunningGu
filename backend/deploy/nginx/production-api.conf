server {
    listen 80;
    server_name api.runninggu.store;
    server_tokens off;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_minimal;
    # OSS nginx error_log는 request 원문을 필드별로 제외할 수 없다. 프로세스 기동·설정 오류는
    # systemd journal에서 확인하고 요청 결과는 최소 access log와 백엔드 traceId로 추적한다.
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name runninggu.store;
    server_tokens off;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_minimal;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.runninggu.store;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.runninggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.runninggu.store/privkey.pem;
    include /etc/nginx/snippets/runninggu-ssl-params.conf;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_minimal;
    error_log /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name runninggu.store;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.runninggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.runninggu.store/privkey.pem;
    include /etc/nginx/snippets/runninggu-ssl-params.conf;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_minimal;
    error_log /dev/null crit;

    root /var/www/runninggu-web;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        return 302 /privacy/;
    }

    location = /privacy {
        return 301 /privacy/;
    }

    location ^~ /privacy/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
