server {
    listen 80;
    server_name staging-api.runninggu.store;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-api.runninggu.store;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/staging-api.runninggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.runninggu.store/privkey.pem;
    include /etc/nginx/snippets/runninggu-ssl-params.conf;

    access_log /var/log/nginx/runninggu-staging.access.log;
    error_log /var/log/nginx/runninggu-staging.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # 외부 전달 헤더를 이어 붙이지 않고 Nginx가 신뢰할 값만 새로 쓴다.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
