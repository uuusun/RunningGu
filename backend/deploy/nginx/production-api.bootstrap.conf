server {
    listen 80;
    server_name api.runninggu.store;
    server_tokens off;

    access_log /var/log/nginx/runninggu-production.access.log runninggu_minimal;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
