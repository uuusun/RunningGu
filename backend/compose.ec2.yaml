x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_S3_BUCKET:?PGBACKREST_S3_BUCKET을 설정해야 합니다}
      PGBACKREST_REPO1_S3_KMS_KEY_ID: ${PGBACKREST_S3_KMS_KEY_ID:?PGBACKREST_S3_KMS_KEY_ID를 설정해야 합니다}
      PGBACKREST_REPO1_S3_ROLE: ${PGBACKREST_S3_ROLE:?PGBACKREST_S3_ROLE을 설정해야 합니다}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=runninggu archive-push %p
      - -c
      - archive_timeout=300s
    volumes:
      - ./deploy/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  graphhopper:
    # base의 로컬 PBF·graph·SRTM mount를 완전히 교체한다. Docker Compose 2.24.4+가 필요하다.
    volumes: !override
      - type: bind
        source: /opt/runninggu-data/graph
        target: /data/graph
    command:
      - -Xms${GRAPHHOPPER_XMS:?GRAPHHOPPER_XMS를 설정해야 합니다}
      - -Xmx${GRAPHHOPPER_XMX:?GRAPHHOPPER_XMX를 설정해야 합니다}
      # GC 시각·소요시간을 요청 성능·메모리와 함께 분석한다(앱 API 계획 §5.3).
      - -Xlog:gc*:stdout:time,uptime,level,tags
      - -jar
      - /opt/graphhopper/graphhopper-web.jar
      - server
      - /opt/graphhopper/graphhopper-server.yml
    restart: "no"
    # 승인된 4GiB 값은 deploy/env/compose.env.example과 계약 §8.1을 따른다.
    # 누락·빈 값을 무제한으로 대체하지 않는다.
    mem_reservation: ${GRAPHHOPPER_MEMORY_RESERVATION:?GRAPHHOPPER_MEMORY_RESERVATION을 설정해야 합니다}
    mem_limit: ${GRAPHHOPPER_MEMORY_LIMIT:?GRAPHHOPPER_MEMORY_LIMIT를 설정해야 합니다}
    # 양수 상한에서는 RAM+swap 합계를 RAM과 같게 해 GraphHopper만 swap을 금지한다(계약 §8.1).
    # 과거 baseline 재현의 명시적 0은 무제한이며 현재 운영값이 아니다.
    memswap_limit: ${GRAPHHOPPER_MEMORY_LIMIT:?GRAPHHOPPER_MEMORY_LIMIT를 설정해야 합니다}
    stop_grace_period: 30s
    logging: *bounded-logging
