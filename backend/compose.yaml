services:
  postgres:
    image: runninggu-postgres:17.10-pgbackrest-2.55.1
    build:
      context: ./postgres
      args:
        PGBACKREST_VERSION: 2.55.1-1
    environment:
      POSTGRES_DB: ${DB_NAME:-runninggu}
      POSTGRES_USER: ${DB_USERNAME:-runninggu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해야 합니다}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - runninggu-postgres-data:/var/lib/postgresql/data

  graphhopper:
    profiles: ["routing"]
    image: ${GRAPHHOPPER_SERVER_IMAGE:-runninggu-graphhopper:11.0}
    build:
      context: ./graphhopper
    command:
      - -Xms${GRAPHHOPPER_XMS:-1g}
      - -Xmx${GRAPHHOPPER_XMX:-6g}
      - -jar
      - /opt/graphhopper/graphhopper-web.jar
      - server
      - /opt/graphhopper/graphhopper-local.yml
    ports:
      - "127.0.0.1:${GRAPHHOPPER_PORT:-8989}:8989"
    volumes:
      - type: bind
        source: ${GRAPHHOPPER_PBF_PATH:-../.cache/osm/korea.osm.pbf}
        target: /data/korea.osm.pbf
        read_only: true
      - runninggu-graphhopper-graph:/data/graph-cache
      - runninggu-graphhopper-srtm:/data/srtm-cache
    restart: unless-stopped

volumes:
  runninggu-postgres-data:
  runninggu-graphhopper-graph:
  runninggu-graphhopper-srtm:
