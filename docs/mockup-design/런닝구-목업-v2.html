<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런닝구 — UI 목업 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=swap">
<style>
/* ================================================================
   런닝구 목업 v2 — 디자인 토큰
   색감은 기존 브랜드 확정값(PRODUCT.md Brand Commitments) 그대로.
   ================================================================ */
:root{
  --blue:#2B5CFF; --blue-ink:#1E40D8; --blue-soft:#EEF2FF; --blue-soft2:#F6F8FF;
  --lime:#C9F23C; --lime-deep:#B3DC28; --orange:#FF6A2B;
  --ink:#15161B; --ink2:#54565E; --ink3:#71747C; --ink4:#86878E; --ink5:#9A9CA2;
  --surface:#FFFFFF; --page:#EDECE8; --fill:#F2F2F0; --fill2:#E9EBEF;
  --line:#E4E4E6; --line2:#ECECEE; --line3:#F0F0F0;
  /* 몰입 레지스터 — 블루 잉크의 심연 (3D 지형 무대) */
  --deep:#0C1024; --deep-2:#131A38; --deep-3:#1B2450;
  --deep-t1:#F2F5FF; --deep-t2:#A9B4DC; --deep-t3:#6E7AA8; --deep-line:rgba(169,180,220,.16);
  --cat-tour-bg:#EAF1FF; --cat-tour-fg:#2B5CFF;
  --cat-food-bg:#FFF3CC; --cat-food-fg:#A66A00;
  --cat-cafe-bg:#F1E9FF; --cat-cafe-fg:#7A4FD0;
  --cat-wellness-bg:#E6F7EE; --cat-wellness-fg:#1B8A5A;
  --cat-nature-bg:#F0FAD8; --cat-nature-fg:#5A8A0A;
  --cat-history-bg:#EFEAFE; --cat-history-fg:#6B4FBB;
  --cat-lodging-bg:#EAEFF5; --cat-lodging-fg:#3E5573;
  --cat-race-bg:#EEF2FF; --cat-race-fg:#2B5CFF;
  --cat-recovery-bg:#FFF1E9; --cat-recovery-fg:#C2410C; --cat-recovery-body:#7C4A2E;
  --font-body:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  --font-num:'Archivo','Pretendard Variable',sans-serif;
  --r-card:20px; --r-btn:16px; --r-md:15px; --r-chip:13px; --r-sm:11px; --r-xs:8px;
  --sh-1:0 1px 2px rgba(21,22,27,.05),0 4px 14px rgba(21,22,27,.06);
  --sh-2:0 2px 6px rgba(21,22,27,.08),0 10px 28px rgba(21,22,27,.10);
  --sh-3:0 6px 16px rgba(12,16,36,.16),0 20px 48px rgba(12,16,36,.18);
  --sh-sheet:0 -12px 40px rgba(12,16,36,.18);
  --pad-x:22px; --cta-h:56px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--page);font-family:var(--font-body);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:inherit}
input{font-family:inherit;outline:none}
::-webkit-scrollbar{width:0;height:0}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;
  direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.msr.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* ── 스테이지(데스크톱 캔버스) ─────────────────────────── */
.stage{min-height:100vh;padding:26px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.stage-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:920px}
.stage-nav .brand{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink5);
  text-transform:uppercase;font-family:var(--font-num);margin-right:4px}
.stage-nav button{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:13px;white-space:nowrap;
  background:#fff;color:var(--ink2);border:1px solid #DEDEDA;transition:all .15s var(--ease-out)}
.stage-nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.phone{width:390px;height:844px;background:var(--surface);border-radius:42px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;flex:none;box-shadow:0 30px 70px rgba(20,22,30,.22),0 0 0 9px #1A1B20}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;position:relative;z-index:30}
.statusbar .t{font-family:var(--font-num);font-size:14px;font-weight:600;letter-spacing:.02em}
.statusbar.on-dark{color:var(--deep-t1)}
.statusbar .cell{display:flex;align-items:flex-end;gap:2px;height:11px}
.statusbar .cell i{width:3px;background:currentColor;border-radius:1px}
.statusbar .batt{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;margin-left:3px}
.statusbar .batt i{display:block;width:70%;height:100%;background:currentColor;border-radius:1px}
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain}
.screen{min-height:100%;display:flow-root;animation:screenIn .34s var(--ease-out)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes snackUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .screen,[class]{animation-duration:.001s !important;transition-duration:.001s !important}
}

/* ── 공통 컴포넌트 ────────────────────────────────────── */
.px{padding-left:var(--pad-x);padding-right:var(--pad-x)}
.h-screen{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.22}
.h-sec{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.55}
.meta{font-size:12px;color:var(--ink4)}
.num{font-family:var(--font-num)}
.divider{height:1px;background:var(--line3)}
.cta{height:var(--cta-h);border-radius:var(--r-btn);background:var(--blue);color:#fff;
  font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  box-shadow:0 6px 18px rgba(30,42,90,.22);transition:transform .15s var(--ease-out),box-shadow .2s}
.cta:active{transform:scale(.985)}
.cta.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.cta.lime{background:var(--lime);color:var(--ink);box-shadow:0 6px 18px rgba(178,220,40,.35)}
.cta[disabled]{background:var(--fill);color:var(--ink5);box-shadow:none;cursor:default}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-chip);white-space:nowrap;display:inline-block}
.chip-open{background:var(--lime);color:var(--ink);font-weight:700}
.chip-before{background:var(--blue-soft);color:var(--blue);font-weight:700}
.chip-closed{background:#EFEFEF;color:var(--ink5);font-weight:700}
.src{font-size:11.5px;color:var(--ink3)}
.badge-live{font-family:var(--font-num);font-size:10px;font-weight:800;letter-spacing:.08em;
  padding:3px 7px;border-radius:7px;background:var(--blue);color:#fff}
.badge-sample{font-family:var(--font-num);font-size:10px;font-weight:800;letter-spacing:.08em;
  padding:3px 7px;border-radius:7px;background:var(--fill);color:var(--ink4)}
.field{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:var(--r-btn);
  padding:0 16px;height:52px;border:1.5px solid transparent;transition:border-color .15s,background .15s}
.field:focus-within{border-color:var(--blue);background:#fff}
.field input{flex:1;border:0;background:none;font-size:15px;color:var(--ink);min-width:0}
.field input::placeholder{color:var(--ink4)}
.seg{display:flex;background:var(--fill);border-radius:var(--r-md);padding:4px;gap:2px}
.seg button{flex:1;height:38px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--ink3);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s var(--ease-out)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.opt-chip{font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:22px;border:1.5px solid var(--line);
  color:var(--ink2);background:#fff;transition:all .15s var(--ease-out)}
.opt-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt-chip.on-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);font-weight:800}
.heart{transition:transform .18s var(--ease-spring)}
.heart.on{animation:popIn .3s var(--ease-spring)}
.tag{font-size:11.5px;font-weight:600;padding:3.5px 9px;border-radius:9px;white-space:nowrap;display:inline-block}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--blue);
  animation:spin .8s linear infinite}
.empty{text-align:center;padding:44px 30px}
.empty .t{font-size:16px;font-weight:800}
.empty .d{font-size:13px;color:var(--ink4);margin-top:7px;line-height:1.55}
.empty button{color:var(--blue);font-size:14px;font-weight:700;margin-top:14px}
.dbg{position:absolute;top:8px;right:10px;z-index:70;display:flex;gap:4px}
.dbg button{font-family:var(--font-num);font-size:9px;font-weight:700;letter-spacing:.05em;padding:3px 7px;
  border-radius:8px;background:rgba(21,22,27,.35);color:#fff;backdrop-filter:blur(4px)}
.dbg button.on{background:var(--orange)}

/* 하단 탭바 */
.tabbar{flex:none;display:flex;align-items:stretch;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line3);padding:10px 8px calc(10px + 8px);position:relative;z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;border-radius:12px}
.tabbar .msr{font-size:24px;color:var(--ink5);transition:color .15s}
.tabbar .lb{font-size:11px;font-weight:600;color:var(--ink5)}
.tabbar button.on .msr{color:var(--blue)}
.tabbar button.on .lb{color:var(--blue);font-weight:800}

/* 스낵바 · 시트 · 모달 */
.snack{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#1F2026;color:#fff;
  font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:var(--sh-2);
  white-space:nowrap;animation:snackUp .22s var(--ease-out);z-index:80}
.scrim{position:absolute;inset:0;background:rgba(12,16,36,.44);z-index:60;animation:fadeIn .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:65;
  box-shadow:var(--sh-sheet);animation:sheetUp .32s var(--ease-out);max-height:78%;display:flex;flex-direction:column}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet-body{overflow-y:auto;padding-bottom:26px}

/* 몰입(다크) 레지스터 */
.deepzone{background:var(--deep);color:var(--deep-t1)}
.deepzone .sub{color:var(--deep-t2)}
.deepzone .meta{color:var(--deep-t3)}
.deepzone .divider{background:var(--deep-line)}
.deepzone input::placeholder{color:var(--deep-t2)}
.stat-num{font-family:var(--font-num);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* 3D 히어로 패널 */
.gl-panel{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 0%,var(--deep-3) 0%,var(--deep-2) 46%,var(--deep) 100%)}
.gl-panel canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.gl-panel .gl-fallback{position:absolute;inset:0;z-index:1}
.gl-veil{position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;z-index:2;
  background:linear-gradient(to top,rgba(12,16,36,.92),rgba(12,16,36,0))}

/* 미니 고도 스트립(카드용 SVG) */
.elev{display:block}
.elev .line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.elev .area{fill:var(--blue-soft);opacity:.9}
.elev.closed .line{stroke:#C9CBD1}
.elev.closed .area{fill:#F1F1F2}

/* 지도 플레이스홀더 (2D 라이트) */
.map2d{position:relative;background:#EDF0EA;overflow:hidden}
.map2d svg{position:absolute;inset:0;width:100%;height:100%}
.map-pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.map-pin .dot{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-num);font-size:12.5px;font-weight:800;
  box-shadow:0 2px 5px rgba(0,0,0,.25);border:2.5px solid #fff}
.map-pin.lime .dot{background:var(--lime);color:var(--ink)}
.map-pin.orange .dot{background:var(--orange)}

/* ── 홈 히어로 ── */
.hero{height:472px;flex:none;position:relative;display:flex;flex-direction:column;color:var(--deep-t1)}
.hero .brandrow{position:relative;z-index:3;display:flex;align-items:center;gap:9px;padding:8px 22px 0}
.hero .logo{width:34px;height:34px;border-radius:11px;background:var(--lime);display:flex;align-items:center;justify-content:center;flex:none}
.hero .wordmark{font-size:20px;font-weight:800;letter-spacing:-.04em}
.hero .searchwrap{position:relative;z-index:3;padding:12px 22px 0}
.hero .field{background:rgba(19,26,56,.72);border:1.5px solid rgba(169,180,220,.22);backdrop-filter:blur(10px)}
.hero .field input{color:var(--deep-t1)}
.hero .field input::placeholder{color:var(--deep-t3)}
.hero .field:focus-within{border-color:var(--lime);background:rgba(19,26,56,.9)}
.hero .featured{position:relative;z-index:3;margin-top:auto;padding:0 22px 44px;cursor:pointer}
.hero .featured .name{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.hero .dday{font-size:52px;font-weight:900;line-height:.95;letter-spacing:-.04em;color:var(--lime);white-space:nowrap;flex:none}
.quickbar{margin:-26px 22px 0;position:relative;z-index:4;background:var(--surface);border-radius:18px;
  box-shadow:var(--sh-2);display:flex;padding:6px 4px}
.quickbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 9px;border-radius:14px;transition:background .15s}
.quickbar button:active{background:var(--blue-soft)}
.quickbar .msr{font-size:25px;color:var(--blue)}
.quickbar .lb{font-size:12px;font-weight:700;color:var(--ink2)}
.railcard{width:212px;flex:none;border:1px solid var(--line2);border-radius:var(--r-card);padding:15px 15px 12px;
  background:var(--surface);cursor:pointer;scroll-snap-align:start;box-shadow:var(--sh-1)}
.pill-hot{font-family:var(--font-num);font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:13px;
  background:var(--cat-recovery-bg);color:var(--cat-recovery-fg);display:inline-block}
.pill-cool{font-family:var(--font-num);font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:13px;
  background:var(--fill);color:var(--ink2);display:inline-block}
.festcard{width:180px;flex:none;cursor:default}
.festph{height:112px;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#EEF2FF 0 10px,#E3EAFB 10px 20px)}
.festph .lb{font-family:var(--font-num);font-size:10px;font-weight:700;letter-spacing:.08em;color:#8FA3D9}
.festph .live{position:absolute;top:9px;left:9px;background:var(--lime);color:var(--ink);font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:10px}

/* ── 대회 로우 (v2 카드) ── */
.racerow{display:flex;gap:14px;padding:15px 16px;border-radius:var(--r-card);background:var(--surface);
  border:1px solid var(--line2);cursor:pointer;position:relative;overflow:hidden;transition:transform .14s var(--ease-out),box-shadow .2s}
.racerow:active{transform:scale(.988)}
.racerow.featured{border:1.5px solid var(--blue);box-shadow:0 10px 26px rgba(43,92,255,.12)}
.racerow.closed .name{color:var(--ink2)}
.racerow.closed .dd{color:var(--ink3)}
.racerow.closed .where{color:var(--ink4)}
.racerow .datecol{width:46px;flex:none;text-align:center}
.racerow .mon{font-family:var(--font-num);font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--blue)}
.racerow.closed .mon{color:var(--ink5)}
.racerow .dd{font-family:var(--font-num);font-size:28px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.racerow .dw{font-size:11.5px;color:var(--ink4);font-weight:600}
.racerow .vline{width:1px;background:var(--line3);flex:none}
.racerow .name{flex:1;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.racerow .where{font-size:12.5px;color:var(--ink4);margin-top:4px}
.racerow .elevline{margin-top:9px}

/* ── 상세 · 결과 · 위저드 ── */
.backbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.backbtn .msr{font-size:25px}
.infobox{border:1px solid var(--line);border-radius:var(--r-card);padding:4px 16px;background:var(--surface)}
.inforow{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line3)}
.inforow:last-of-type{border-bottom:0}
.inforow .k{width:66px;flex:none;font-size:13px;color:var(--ink4)}
.inforow .v{flex:1;font-size:13.5px;font-weight:600}
.glcard{position:relative;height:196px;border-radius:var(--r-card);overflow:hidden;
  background:radial-gradient(130% 100% at 50% 0%,var(--deep-3) 0%,var(--deep-2) 48%,var(--deep) 100%)}
.glcard .cap{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;
  background:rgba(12,16,36,.85);padding:5px 9px;border-radius:9px;backdrop-filter:blur(10px)}
.glcard .cap .t{font-size:11.5px;font-weight:700;color:var(--deep-t2)}
.recovery-banner{background:var(--cat-recovery-bg);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.recovery-banner .msr{font-size:20px;color:var(--orange)}
.recovery-banner .t{font-size:12.5px;font-weight:600;color:var(--cat-recovery-fg);line-height:1.4}
.wbar{flex:1;height:4px;border-radius:2px;background:#EDEDEF}
.wbar.on{background:var(--blue)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.timeline-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--font-num);font-size:12px;font-weight:800;background:var(--surface);color:var(--ink4);border:1.5px solid var(--line)}
.stickycta{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 26%);padding:16px 22px 18px}

/* 고도 스트립 draw-on */
@keyframes strokeDraw{from{stroke-dashoffset:var(--len,480)}to{stroke-dashoffset:0}}
.drawline{stroke-dasharray:var(--len,480);animation:strokeDraw 1.4s var(--ease-out) .15s both}

/* 디버그 레일 (폰 옆) */
.debug-rail{position:absolute;left:calc(100% + 18px);top:70px;display:flex;flex-direction:column;gap:4px;
  background:rgba(21,22,27,.88);padding:8px;border-radius:12px;z-index:5;min-width:64px}
.debug-rail .cap{font-family:var(--font-num);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--ink5);padding:0 2px 2px}
.debug-rail button{font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;text-align:center;color:#fff;background:rgba(255,255,255,.12)}

<script>
/* ================================================================
   RG3D — 데이터 3D 엔진: 등고 지형 + 코스 리본 + km 마커
   모든 장면이 이 하나의 문법을 공유한다 (홈 히어로 · 코스 · 기록 요약)
   ================================================================ */
const RG3D = (() => {
  let ready = false, failed = false;
  const queue = [];
  window.addEventListener('three-ready', () => { ready = true; queue.splice(0).forEach(fn => fn()); });
  window.addEventListener('three-failed', () => { failed = true; queue.splice(0).forEach(fn => fn()); });
  setTimeout(() => { if (!ready && !failed) { failed = true; queue.splice(0).forEach(fn => fn()); } }, 6000);

  /* 결정적 값-노이즈 (시드 고정 → 코스마다 같은 지형) */
  function makeNoise(seed){
    const h = n => { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); };
    const g = (x, y) => h(x * 157 + y * 113);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return g(xi, yi) * (1 - u) * (1 - v) + g(xi + 1, yi) * u * (1 - v) +
             g(xi, yi + 1) * (1 - u) * v + g(xi + 1, yi + 1) * u * v;
    };
  }
  function heightAt(noise, x, z, amp){
    return (noise(x * 1.6 + 4, z * 1.6 + 4) * .62 + noise(x * 3.6, z * 3.6) * .28 + noise(x * 8, z * 8) * .10) * amp;
  }

  /* 장면 스펙: { seed, amp, route:[[x,z],...] (-1..1), km:[라벨…], progress(0..1), spin, live } */
  function mount(el, spec){
    if (!el) return null;
    const handle = { update(){}, setProgress(){}, dispose(){} };
    const start = () => {
      if (failed || !window.THREE) { svgFallback(el, spec); return; }
      try { build(el, spec, handle); } catch (e) { svgFallback(el, spec); }
    };
    ready || failed ? start() : queue.push(start);
    return handle;
  }

  function build(el, spec, handle){
    const THREE = window.THREE;
    const W = el.clientWidth || 390, H = el.clientHeight || 320;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W, H);
    el.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0c1024, 3.4, 7.8);
    const cam = new THREE.PerspectiveCamera(38, W / H, .1, 30);
    const noise = makeNoise(spec.seed || 1);
    const amp = spec.amp ?? .34;

    /* 지형 — 정점색: 심연 블루 → 능선으로 갈수록 밝은 블루 */
    const seg = 96, size = 4.6;
    const geo = new THREE.PlaneGeometry(size, size, seg, seg);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position, colors = [];
    const cLow = new THREE.Color(0x111838), cMid = new THREE.Color(0x27367a), cHi = new THREE.Color(0x5570d6);
    for (let i = 0; i < pos.count; i++){
      const x = pos.getX(i), z = pos.getZ(i);
      const y = heightAt(noise, x / size + .5, z / size + .5, amp);
      pos.setY(i, y);
      const t = Math.min(1, y / (amp * .85));
      const c = t < .5 ? cLow.clone().lerp(cMid, t / .5) : cMid.clone().lerp(cHi, (t - .5) / .5);
      colors.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors: true, flatShading: true, roughness: .88, metalness: .05 }));
    scene.add(terrain);

    /* 등고선 느낌의 와이어 오버레이(성긴 그리드) */
    const wire = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({
      color: 0x5a6cbe, wireframe: true, transparent: true, opacity: .05 }));
    wire.position.y += .002;
    scene.add(wire);

    /* 코스 리본 — 라임, setDrawRange 로 스스로 그려진다 */
    let applyProgress = () => {}, progress = 1;
    const dot = (v, color, s) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(s || .04, 16, 16),
        new THREE.MeshBasicMaterial({ color }));
      m.position.copy(v); scene.add(m); return m;
    };
    if (!spec.noRoute){
      const rt = (spec.route && spec.route.length > 1 ? spec.route : [[-.6,-.4],[.2,-.5],[.55,.05],[.1,.5],[-.5,.35]])
        .map(([x, z]) => new THREE.Vector3(x * size * .58, 0, z * size * .58));
      rt.forEach(v => { v.y = heightAt(noise, v.x / size + .5, v.z / size + .5, amp) + .055; });
      const curve = new THREE.CatmullRomCurve3(rt, !!spec.loop, 'centripetal', .8);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 320, .034, 8, !!spec.loop),
        new THREE.MeshStandardMaterial({ color: 0xC9F23C, emissive: 0x9dbf1e, emissiveIntensity: .8, roughness: .3 }));
      scene.add(tube);
      const idxCount = tube.geometry.index.count;
      progress = spec.progress ?? 0;
      applyProgress = p => tube.geometry.setDrawRange(0, Math.floor(idxCount * Math.max(0, Math.min(1, p))));
      applyProgress(progress);
      dot(rt[0], 0xC9F23C, .055);
      /* km 마커 — 아이보리 구슬 (텍스처 없는 안전한 표현) */
      (spec.km || []).forEach((label, i, arr) => {
        const t = (i + 1) / (arr.length + (spec.loop ? 0 : 1));
        const p = curve.getPointAt(Math.min(t, .999)).clone(); p.y += .02;
        dot(p, 0xF2F5FF, .034);
      });
    }

    scene.add(new THREE.AmbientLight(0x93a4dd, 1.0));
    const key = new THREE.DirectionalLight(0xf2f5ff, 1.5); key.position.set(2.4, 3.2, 1.6); scene.add(key);
    const rim = new THREE.DirectionalLight(0xC9F23C, .3); rim.position.set(-2.2, 1.2, -2.4); scene.add(rim);

    /* 카메라 — 느린 궤도 + 드래그 */
    let az = spec.az ?? .62, alt = spec.alt ?? .5, dist = spec.dist ?? 2.5, dragging = false, px = 0;
    const setCam = () => {
      cam.position.set(Math.sin(az) * Math.cos(alt) * dist, Math.sin(alt) * dist + .3, Math.cos(az) * Math.cos(alt) * dist);
      cam.lookAt(0, .12, 0);
    };
    el.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; });
    addEventListener('pointermove', e => { if (dragging){ az += (e.clientX - px) * .006; px = e.clientX; } });
    addEventListener('pointerup', () => dragging = false);

    let disposed = false, drawT = 0;
    const clock = { last: performance.now() };
    function frame(now){
      if (disposed) return;
      const dt = Math.min(.05, (now - clock.last) / 1000); clock.last = now;
      if (!dragging) az += dt * (spec.spin ?? .07);
      if (spec.autoDraw !== false && progress < 1){ drawT += dt; progress = Math.min(1, drawT / (spec.drawSec ?? 2.6)); applyProgress(progress); }
      setCam(); renderer.render(scene, cam);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    handle.setProgress = p => { spec.autoDraw = false; progress = p; applyProgress(p); };
    handle.dispose = () => { disposed = true; renderer.dispose(); el.contains(renderer.domElement) && el.removeChild(renderer.domElement); };
  }

  /* WebGL 불가 시: 같은 데이터로 그리는 정적 SVG (레이어드 능선 + 라임 경로) */
  function svgFallback(el, spec){
    const noise = makeNoise(spec.seed || 1);
    const W = 390, H = 320;
    let ridges = '';
    for (let r = 0; r < 4; r++){
      let d = `M0 ${H}`;
      for (let x = 0; x <= W; x += 10){
        const y = H * (.42 + r * .13) - heightAt(noise, x / W + r * .3, r * .5, 1) * 70;
        d += ` L${x} ${y.toFixed(1)}`;
      }
      d += ` L${W} ${H} Z`;
      const shade = ['#1B2450', '#182050', '#131A38', '#101736'][r];
      ridges += `<path d="${d}" fill="${shade}"/>`;
    }
    const rt = (spec.route || [[-.6,-.4],[.2,-.5],[.55,.05],[.1,.5],[-.5,.35]])
      .map(([x, z]) => [ (x * .42 + .5) * W, (z * .3 + .55) * H ]);
    const path = 'M' + rt.map(p => p.map(n => n.toFixed(1)).join(' ')).join(' L');
    el.innerHTML = `<div class="gl-fallback"><svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
      ${ridges}
      <path d="${path}" fill="none" stroke="#C9F23C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${rt[0][0]}" cy="${rt[0][1]}" r="6" fill="#C9F23C"/>
    </svg></div>`;
  }

  return { mount };
})();

/* 미니 고도 스트립 — 대회별 결정적 프로파일 (같은 노이즈 문법) */
function elevPath(seed, W, H, closed){
  let pts = [];
  for (let i = 0; i <= 24; i++){
    const t = i / 24;
    const v = Math.abs(Math.sin(t * 9 + seed * 1.7) * .55 + Math.sin(t * 23 + seed * 3.1) * .3 + Math.sin(t * 47 + seed) * .15);
    pts.push([t * W, H - 3 - v * (H - 8)]);
  }
  const line = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  return { line, area: line + ` L${W} ${H} L0 ${H} Z` };
}
function elevStrip(seed, W, H, closed){
  const p = elevPath(seed, W, H);
  return `<svg class="elev${closed ? ' closed' : ''}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path class="area" d="${p.area}"></path><path class="line" d="${p.line}"></path></svg>`;
}

function calChips(){
  const f = S.f, chips = [];
  f.events.forEach(e => chips.push({ label:e, act:`APP.rmEventFilter('${e}')` }));
  if (f.openOnly) chips.push({ label:'접수 가능만', act:'APP.rmOpenOnly()' });
  f.regions.forEach(r => chips.push({ label:r, act:`APP.rmRegionFilter('${r}')` }));
  return chips;
}
function calListBody(){
  const all = filtered();
  const monthPrefix = S.calY + '-' + String(S.calM + 1).padStart(2, '0');
  const monthList = all.filter(c => c.date.indexOf(monthPrefix) === 0);
  const dayList = S.selDate ? all.filter(c => c.date === S.selDate) : monthList;
  const shown = S.view === 'list' ? all : dayList;
  let firstOpen = -1;
  shown.forEach((c, i) => { if (firstOpen < 0 && c.status === 'open') firstOpen = i; });
  /* 빈 상태는 "왜 비었는지"에 따라 문구가 갈린다 — 검색 / 필터 / 날짜 / 달 */
  const hasFilter = S.f.events.length || S.f.regions.length || S.f.openOnly;
  const emptyTitle = S.view === 'list'
    ? (S.q.trim() ? '검색 결과가 없어요' : hasFilter ? '조건에 맞는 대회가 없어요' : '예정된 대회가 없어요')
    : S.selDate ? '이 날에는 대회가 없어요' : '이 달에는 대회가 없어요';
  const cs = S.dbg.cal;
  if (cs === 'loading') return `
    ${S.view === 'cal' ? calGrid() : ''}
    ${skelRaceRows(4)}`;
  if (cs === 'error') return `
    ${S.view === 'cal' ? calGrid() : ''}
    ${errorBlock('대회 정보를 불러오지 못했어요', "APP.dbgCal('ok')", '56px')}`;
  return `
    ${S.view === 'list' ? `<div class="px" style="padding-top:4px;padding-bottom:10px;font-size:13.5px;font-weight:600;color:var(--ink2)">대회 <span class="num" style="color:var(--blue);font-weight:800">${all.length}</span></div>` : ''}
    ${S.view === 'cal' ? calGrid() : ''}
    <div class="px" style="display:flex;flex-direction:column;gap:10px">
      ${shown.map((c, i) => raceRow(c, S.view === 'list' && i === firstOpen)).join('')}
    </div>
    ${shown.length === 0 ? `<div class="empty" style="padding:56px 34px">
      <div class="t">${emptyTitle}</div>
      ${(S.q.trim() || hasFilter) ? `<button onclick="APP.resetFilters()">필터 초기화</button>` : ''}
    </div>` : ''}`;
}
function calGrid(){
  const first = new Date(S.calY, S.calM, 1);
  const days = new Date(S.calY, S.calM + 1, 0).getDate();
  const pad = first.getDay();
  /* 날짜별 대회 수 조회만 실패한 경우 — 목록은 그대로 두고 날짜 점만 숨긴다 (부분 실패) */
  const noDots = S.dbg.cal === 'nodots';
  const counts = {};
  if (!noDots) filtered().forEach(c => { counts[c.date] = (counts[c.date] || 0) + 1; });
  let cells = '';
  for (let i = 0; i < pad; i++) cells += `<div style="height:46px"></div>`;
  for (let d = 1; d <= days; d++){
    const ds = S.calY + '-' + String(S.calM + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const dow = new Date(S.calY, S.calM, d).getDay();
    const sel = S.selDate === ds, today = ds === TODAY, n = counts[ds] || 0;
    cells += `<button onclick="APP.selDate('${ds}')" style="height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:13px;background:${sel ? 'var(--blue-soft)' : 'transparent'}">
      <span class="num" style="width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:${sel ? 800 : 500};
        color:${sel ? '#fff' : dow === 0 ? '#E5484D' : dow === 6 ? 'var(--blue)' : 'var(--ink)'};
        background:${sel ? 'var(--blue)' : 'transparent'};border:1.5px solid ${today && !sel ? 'var(--blue)' : 'transparent'}">${d}</span>
      ${n > 0 ? (n > 1
        ? `<span class="num" style="height:13px;min-width:13px;padding:0 4px;border-radius:7px;background:var(--blue);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center">${n}</span>`
        : `<span style="width:5px;height:5px;border-radius:50%;background:var(--blue)"></span>`)
        : ''}
    </button>`;
  }
  const selD = S.selDate ? new Date(S.selDate + 'T00:00:00') : null;
  const monthPrefix = S.calY + '-' + String(S.calM + 1).padStart(2, '0');
  const all = filtered();
  const monthList = all.filter(c => c.date.indexOf(monthPrefix) === 0);
  const dayList = S.selDate ? all.filter(c => c.date === S.selDate) : monthList;
  const label = selD
    ? `${String(selD.getMonth() + 1).padStart(2, '0')}.${String(selD.getDate()).padStart(2, '0')} (${DOW[selD.getDay()]}) 대회 ${dayList.length}`
    : `${S.calY}.${S.calM + 1} 대회 ${monthList.length}`;
  return `<div class="px" style="padding-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 0 12px">
      <button onclick="APP.prevMonth()" aria-label="이전 달">${msr('chevron_left', { size:24, color:'var(--ink2)' })}</button>
      <span class="num" style="font-size:19px;font-weight:800;letter-spacing:-.01em;min-width:88px;text-align:center">${S.calY}.${S.calM + 1}</span>
      <button onclick="APP.nextMonth()" aria-label="다음 달">${msr('chevron_right', { size:24, color:'var(--ink2)' })}</button>
    </div>
    <div class="calgrid" style="margin-bottom:4px">
      ${DOW.map((d, i) => `<div style="text-align:center;font-size:11.5px;font-weight:700;color:${i === 0 ? '#E5484D' : i === 6 ? 'var(--blue)' : 'var(--ink4)'}">${d}</div>`).join('')}
    </div>

const toM = s => /km/.test(s) ? Math.round(parseFloat(s) * 1000) : parseInt(s, 10);

   사용자는 데이터가 두루누비에서 왔는지 카카오에서 왔는지 알 필요가 없다.
   대신 "따라갈 경로가 있는가"는 실제로 중요한 차이라 카드마다 표시한다. */
function nearItems(){
  const spots = spotsNow().map(sp => ({
    route:false, name:sp.name, sub:`${sp.cat} · ${sp.dist}`, m:toM(sp.dist)
  }));
  if (S.dbg.courses !== 'ok') return spots.sort((a, b) => a.m - b.m);
  const mins = Math.max(1, Math.round(S.dist * 1000 / 110));
  const items = [
    { route:true, name:`${S.course} 왕복`, sub:`왕복 ${S.dist.toFixed(1)}km · 약 ${mins}분 · 난이도 중`, m:420, seed:23, picked:true },
    { route:true, name:'해파랑길 2코스 왕복', sub:'왕복 5.0km · 약 45분 · 난이도 중', m:1200, seed:30 },

  ];
  return items.concat(spots).sort((a, b) => a.m - b.m);
}

      <div class="wbar on"></div>
      <div class="wbar ${step >= 2 ? 'on' : ''}"></div>

  <div style="flex:1;min-height:26px"></div>

    <button class="cta" ${ctaOn ? '' : 'disabled'} onclick="APP.wizardNext()">${ctaLabel}</button>

}

    cells += `<button onclick="APP.tapWizDay(${d})" style="height:38px;display:flex;align-items:center;justify-content:center;

      <span class="num" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:${race ? 800 : 500};

      <span style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2)"><span style="width:11px;height:11px;border-radius:3px;background:var(--blue-soft);display:inline-block"></span>여행 기간</span>

/* ================================================================
   3D 장면 마운트 · 화면별 부트
   ================================================================ */
function mountScenes(){
  const staticShot = location.hash.indexOf('!s') >= 0; /* 검수용: 리본 완성 상태로 캡처 */
  document.querySelectorAll('[data-gl]').forEach(el => {
    const spec = Object.assign({}, ROUTES3D[el.getAttribute('data-gl')] || ROUTES3D.sejong);
    try { Object.assign(spec, JSON.parse(el.getAttribute('data-gl-opts') || '{}')); } catch (e) {}
    if (staticShot){ spec.progress = 1; spec.autoDraw = false; }
    glHandles.push(RG3D.mount(el, spec));
  });
}
function countUp(id, target, fmt, ms){
  const el = document.getElementById(id);
  if (!el) return;
  const t0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(target * e);
    if (k < 1 && document.getElementById(id)) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function bootScreen(){
  if (S.screen === 'result' && !S.editMode){
    const vp = $('#viewport');
    vp.onscroll = () => {
      if (S.screen !== 'result' || S.editMode) return;
      const box = vp.getBoundingClientRect(), mid = box.top + box.height * .45;
      let best = null, bd = 1e9;
      document.querySelectorAll('[data-block]').forEach(el => {
        const r = el.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
        if (d < bd){ bd = d; best = parseInt(el.getAttribute('data-block'), 10); }
      });
      if (best !== null && best !== S.activeBlock){ S.activeBlock = best; render(); }
    };
  } else { $('#viewport').onscroll = null; }
}

  setStartQ: v => { S.startQ = v; },
  /* 출발지에 따라 두루누비 코스 유무가 갈린다 — 서울은 실제로 0건이라 걷기 좋은 곳으로 넘어간다 */
  setCourseStart(p){ set({ courseStart: p, dbg: Object.assign({}, S.dbg, { courses: NO_COURSE_STARTS.indexOf(p) >= 0 ? 'nocourse' : 'ok' }) }); },
  openSpot(name){ toast(name + ' · 카카오 장소로 이동'); },
  setCourse(c){ set({ course: c }); },
  pickNear(name){ set({ course: name.replace(/ 왕복$/, '') }); },
  setCRegion(r){ set({ cRegion: S.cRegion === r ? null : r }); },
  setDist(v){
    S.dist = parseFloat(v);
    const lb = $('#dist-label'); if (lb) lb.textContent = S.dist.toFixed(1) + 'km';
    const card = $('#course-card'); if (card) card.innerHTML = courseInfoHtml();
  },
  saveCourse(){ if (guard('course')) return; S.courseSaved = true; S.libTab = 'course'; render(); toast('보관함에 저장했어요'); },
  /* 동선 결과 · 편집 */
  setDay(i){ set({ activeDay:i, activeBlock:0 }); },
  setActiveBlock(i){ set({ activeBlock:i }); },
  toggleEdit(){ set({ editMode: !S.editMode }); },
  /* 대회 블록(RACE)은 사용자가 못 바꾼다 — 서버도 409 SYSTEM_BLOCK_IMMUTABLE 로 거절한다 (§5.7) */
  removeBlock(i){
    if (S.itin[S.activeDay].blocks[i].race) return toast('대회 일정은 바꿀 수 없어요');
    mutate(d => d.blocks.splice(i, 1));
  },
  dragStart(i){ S._drag = S.itin[S.activeDay].blocks[i].race ? null : i; },
  dropOn(i){
    const day = S.itin[S.activeDay];
    if (S._drag === null || S._drag === i || day.blocks[i].race){ S._drag = null; return; }
    mutate(d => { const [x] = d.blocks.splice(S._drag, 1); d.blocks.splice(i, 0, x); });
    S._drag = null;
  },
  openSwap(i, cat){ S.poi = { mode:'replace', idx:i, cat }; renderOverlays(); },
  openAdd(){ S.poi = { mode:'add', idx:-1, cat:'관광지' }; renderOverlays(); },
  closePoi(){ S.poi = null; renderOverlays(); },
  setPoiCat(c){ S.poi = Object.assign({}, S.poi, { cat:c }); renderOverlays(); },
  pickPoi(idx){
    const p = POIS[idx];
    if (S.poi.mode === 'replace') mutate(d => { d.blocks[S.poi.idx] = Object.assign({}, d.blocks[S.poi.idx], { place:p.name, desc:p.desc }); });
    else mutate(d => d.blocks.push({ time:'13:00', title:'추가 일정', cat:S.poi.cat, place:p.name, desc:p.desc }));
    S.poi = null; render();
  },
  shareRoute(){ toast('동선을 공유했어요'); },
  saveRoute(){ if (guard('route')) return; S.saved = true; S.libTab = 'route'; toast('보관함에 저장했어요'); setTimeout(() => go('library'), 700); },
  goCoursesFromHotel(){ S.courseStart = '호텔 세종 가온'; go('courses'); },
  /* 위저드 */
  pickPattern(key){
    const p = PATTERNS.find(x => x.key === key);
    if (key === 'custom') set({ wPattern:key, wStart:null, wEnd:null });
    else set({ wPattern:key, wStart:p.s, wEnd:p.e });
  },
  tapWizDay(d){
    if (S.wPattern !== 'custom') return;
    if (!S.wStart || (S.wStart && S.wEnd)) set({ wStart:d, wEnd:null });
    else if (d < S.wStart) set({ wStart:d, wEnd:S.wStart });
    else set({ wEnd:d });
  },
  setWEvent(e){ set({ wEvent:e }); },
  togglePref(label){
    const a = S.wPrefs.slice(), i = a.indexOf(label);
    if (i >= 0) a.splice(i, 1); else a.push(label);
    set({ wPrefs:a });
  },
  setHotelQ(v){ S.hotelQ = v; const l = $('#hotel-list'); if (l) l.innerHTML = hotelListHtml(); },
  setHotel(name){ set({ hotel: S.hotel === name ? null : name }); },
  wizardNext(){
    if (S.screen === 'w1') go('w2');
    else if (S.screen === 'w2'){ if (S.wPrefs.length) go('w3'); }
    else if (S.screen === 'w3'){
      if (S.generating) return;
      set({ generating:true });
      setTimeout(() => { S.generating = false; S.resultFrom = 'w3'; S.activeDay = 1; S.activeBlock = 0; go('result'); }, 900);
    }
  },
  /* 확인 모달 — 되돌릴 수 없는 동작 */
  askDelete(k){ S.confirm = k; renderOverlays(); },
  closeConfirm(){ S.confirm = null; renderOverlays(); },
  doDeleteRoute(){ S.confirm = null; S.saved = false; render(); toast('동선을 삭제했어요'); },
  doDeleteCourse(){ S.confirm = null; S.courseSaved = false; S.libTab = 'course'; go('library'); toast('코스를 삭제했어요'); },
  doQuit(){ S.confirm = null; S.guest = false; S.returnTo = null; go('login'); toast('탈퇴가 처리됐어요'); },
  /* 내 정보 · 계정 관리 */
  toast,
  toggleMkt(){ S.acctMkt = !S.acctMkt; render(); toast(S.acctMkt ? '마케팅 수신에 동의했어요' : '마케팅 수신을 껐어요'); },
  toggleKakao(){ S.kakaoLinked = !S.kakaoLinked; render(); toast(S.kakaoLinked ? '카카오 계정을 연결했어요' : '카카오 연결을 해제했어요'); },
  logout(){ S.guest = false; S.returnTo = null; go('login'); },
  /* 네트워크 */
  setOffline(v){ S.offline = v; render(); },
  dbgNet(k){ S.offline = k === 'off'; render(); },
  reconnect(){ S.offline = false; render(); toast('최신 정보로 새로고침했어요'); },
  /* 디버그 */
  setFestState(k){ set({ festState:k }); },
  dbgW3(k){ S.dbg.w3 = k; render(); },
  dbgResult(k){ S.dbg.result = k; render(); },
  dbgCourses(k){ S.dbg.courses = k; render(); },
  dbgLib(k){ S.dbg.lib = k; render(); },
  dbgLogin(k){ S.dbg.login = k; render(); },
  dbgHome(k){ S.dbg.home = k; render(); },
  dbgFest(k){ S.dbg.fest = k; render(); },
  dbgCal(k){ S.dbg.cal = k; render(); }
};
window.APP = APP;

/* 해시 딥링크 — 데모·검수용: #home · #calendar-cal · #calendar-filter · #result-edit · #signup-3 … */
(function bootFromHash(){
  const h = (location.hash || '').replace('#', '').replace('!s', '');
  if (!h) return;
  const [key, mod] = h.split('-');
  if (SCREENS[key]) S.screen = key;
  if (key === 'calendar' && mod === 'cal') S.view = 'cal';
  if (key === 'calendar' && mod === 'filter'){ S.filterOpen = true; S.draft = { events:S.f.events.slice(), openOnly:S.f.openOnly, regions:S.f.regions.slice() }; }
  if (key === 'result' && mod === 'edit') S.editMode = true;
  if (key === 'result' && mod === 'poi') S.poi = { mode:'add', idx:-1, cat:'관광지' };
  if (key === 'signup' && mod) S.suStep = Math.max(1, Math.min(4, parseInt(mod, 10) || 1));
  if (key === 'courses' && mod === 'region') S.cTab = 'region';
  if (key === 'library' && mod === 'course') S.libTab = 'course';
  if (key === 'library' && mod === 'fav') S.libTab = 'fav';
  if (key === 'home' && mod === 'guest'){ S.guest = true; S.guestOpen = true; }
})();

render();

</script>
</body>
</html>
