graphhopper:
  # build-graph.sh가 날짜 고정 PBF의 실제 파일명으로 __PBF_FILE_NAME__을 치환한다.
  datareader.file: /work/input/__PBF_FILE_NAME__
  graph.location: /work/output/graph

  import.osm.ignored_highways: motorway,trunk
  graph.encoded_values: foot_access, foot_priority, foot_average_speed, average_slope, hike_rating, road_class, road_environment, surface

  profiles:
    - name: run
      custom_model:
        priority:
          - if: "!foot_access"
            multiply_by: "0"
          - if: "road_class == FOOTWAY || road_class == PATH || road_class == PEDESTRIAN"
            multiply_by: "1.0"
          - else_if: "road_class == CYCLEWAY || road_class == TRACK"
            multiply_by: "0.95"
          - else_if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.5"
          - else_if: "road_class == SERVICE"
            multiply_by: "0.25"
          - else_if: "road_class == TERTIARY"
            multiply_by: "0.2"
          - else_if: "road_class == PRIMARY || road_class == SECONDARY || road_class == TRUNK"
            multiply_by: "0.05"
          - else_if: "road_class == STEPS"
            multiply_by: "0.05"
        speed:
          - if: "true"
            limit_to: "foot_average_speed"

  profiles_ch: []
  profiles_lm:
    - profile: run

  graph.elevation.provider: srtm
  graph.elevation.cache_dir: /work/srtm-cache
  routing.non_ch.max_waypoint_distance: 1000000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
